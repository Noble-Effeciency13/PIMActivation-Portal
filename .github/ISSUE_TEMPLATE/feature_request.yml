name: Feature request
description: Suggest a new capability or improvement for the PIMActivation Portal.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature. Before submitting, please skim the open [feature requests](https://github.com/Noble-Effeciency13/PIMActivation-Portal/issues?q=is%3Aissue+label%3Aenhancement) and the [Roadmap wiki page](https://github.com/Noble-Effeciency13/PIMActivation-Portal/wiki/Roadmap) so we can avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? What is frustrating or missing today?
      placeholder: I am always frustrated when …
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you would like to see happen.
    validations:
      required: true

  - type: textarea
    id: ui
    attributes:
      label: Where this would appear in the UI
      description: |
        - Where would the feature live (header, table, modal, settings, profile)?
        - What controls or affordances would users interact with?
        - How would discoverability work?

  - type: dropdown
    id: planes
    attributes:
      label: PIM planes affected
      multiple: true
      options:
        - Microsoft Entra ID roles
        - Azure Resource roles
        - PIM for Groups
        - Cross-cutting / not plane-specific

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why they fell short.

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: |
        - How often would you use this?
        - How many users in your organization would benefit?
        - What time or effort would this save?

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints acknowledgement
      description: The portal stays strictly client-side and direct-to-Microsoft. Confirm your suggestion respects that.
      options:
        - label: This feature can be implemented without adding a backend, proxy, or third-party API call.
        - label: This feature does not require persisting access tokens or other credentials outside `sessionStorage`.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, links, or anything else that helps illustrate the idea.
