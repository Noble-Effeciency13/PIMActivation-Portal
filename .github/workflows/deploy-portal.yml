name: Deploy Portal

on:
  push:
    branches: [main]
    paths:
      - 'Portal/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject client ID
        run: sed -i "s/__PORTAL_CLIENT_ID__/${{ secrets.PORTAL_CLIENT_ID }}/g" Portal/js/msal-config.js

      - name: Verify client ID placeholder replaced
        run: |
          if grep -q '__PORTAL_CLIENT_ID__' Portal/js/msal-config.js; then
            echo "ERROR: placeholder was not replaced" && exit 1
          fi

      - name: Compute and inject MSAL SRI hash
        run: |
          MSAL_URL="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"
          HTTP_STATUS=$(curl -o /tmp/msal-browser.min.js -s -w "%{http_code}" "$MSAL_URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: MSAL CDN returned HTTP $HTTP_STATUS" && exit 1
          fi
          HASH=$(openssl dgst -sha256 -binary /tmp/msal-browser.min.js | openssl base64 -A)
          SRI_VALUE="sha256-${HASH}"
          echo "Computed SRI: $SRI_VALUE"
          sed -i "s|__MSAL_SRI__|${SRI_VALUE}|g" Portal/index.html

      - name: Verify MSAL SRI placeholder replaced
        run: |
          if grep -q '__MSAL_SRI__' Portal/index.html; then
            echo "ERROR: MSAL SRI placeholder was not replaced" && exit 1
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: Portal
          output_location: ''
