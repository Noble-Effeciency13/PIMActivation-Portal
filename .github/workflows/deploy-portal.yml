name: Deploy Portal

on:
  push:
    branches: [main]
    paths:
      - 'Portal/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject client ID
        run: sed -i "s/__PORTAL_CLIENT_ID__/${{ secrets.PORTAL_CLIENT_ID }}/g" Portal/js/msal-config.js

      - name: Verify placeholder replaced
        run: |
          if grep -q '__PORTAL_CLIENT_ID__' Portal/js/msal-config.js; then
            echo "ERROR: placeholder was not replaced" && exit 1
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: Portal
          output_location: ''
