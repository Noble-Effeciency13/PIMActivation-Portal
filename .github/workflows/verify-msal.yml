name: Verify Vendored MSAL

on:
  pull_request:
    paths:
      - 'Portal/js/lib/**'
      - 'security/package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify MSAL hash against npm registry
        shell: pwsh
        run: ./security/verify-msal.ps1
